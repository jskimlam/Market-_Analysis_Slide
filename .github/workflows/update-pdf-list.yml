name: Update PDF list.json

on:
  push:
    paths:
      - 'pdfs/*.pdf'
      - 'generate_list.py'
      - '.github/workflows/update-pdf-list.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate list.json
        run: python generate_list.py

      - name: Commit updated list.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pdfs/list.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto-update pdfs/list.json"
          git push
