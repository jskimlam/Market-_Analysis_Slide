<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Market Information Slide · LAM</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --orange: #FF8C00;
      --red:    #D93025;
      --black:  #000000;
      --white:  #FFFFFF;
      --bg:     #F0F0EE;
      --gray1:  #1A1A1A;
      --gray2:  #444444;
      --gray3:  #888888;
      --border: 2px solid var(--black);
      --shadow: 4px 4px 0px var(--black);
      --mono:   'DM Mono', monospace;
      --disp:   'Montserrat', sans-serif;
      --sans:   'Noto Sans KR', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--gray1);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .hdr {
      background: var(--white);
      border-bottom: var(--border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }

    .hdr-left {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-badge {
      background: var(--orange);
      border: var(--border);
      box-shadow: var(--shadow);
      font-family: var(--disp);
      font-size: 14px;
      font-weight: 900;
      padding: 5px 14px;
      letter-spacing: 1px;
    }

    .hdr-center {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand-title {
      font-family: var(--disp);
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -1px;
      white-space: nowrap;
    }

    .brand-title span {
      color: var(--red);
    }

    .hdr-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .sel-wrap {
      position: relative;
    }

    .sel-wrap select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      padding: 7px 32px 7px 12px;
      cursor: pointer;
      outline: none;
      min-width: 120px;
      transition: box-shadow .1s;
    }

    .sel-wrap select:focus {
      box-shadow: 6px 6px 0px var(--black);
    }

    .sel-wrap::after {
      content: '▼';
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      pointer-events: none;
    }

    .security {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--red);
      white-space: nowrap;
      border: 1px solid var(--red);
      padding: 3px 8px;
    }

    .main-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 24px 12px;
      gap: 12px;
      min-height: 0;
    }

    .viewer-frame {
      flex: 1;
      position: relative;
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 0;
    }

    .pdf-viewer {
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #f7f7f7;
    }

    .empty-state {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--gray3);
      text-align: center;
      padding: 20px;
    }

    .empty-state .big {
      font-size: 48px;
    }

    .empty-state .msg {
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--white);
      border: var(--border);
      box-shadow: var(--shadow);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 12px;
      cursor: pointer;
      text-decoration: none;
      color: var(--black);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
    }

    .btn:hover {
      background: var(--orange);
    }

    .btn:active {
      box-shadow: 2px 2px 0 var(--black);
      transform: translate(2px, 2px);
    }

    .btn.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .file-name {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--gray2);
      word-break: break-all;
    }

    .source {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--gray3);
      font-style: italic;
    }

    .ftr {
      border-top: var(--border);
      background: var(--white);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .ftr-left {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
    }

    .ftr-right {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--gray3);
    }

    #loading {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 700;
      gap: 10px;
    }

    #loading.hidden {
      display: none;
    }

    .spin {
      width: 20px;
      height: 20px;
      border: 3px solid var(--black);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .hdr {
        height: auto;
        flex-wrap: wrap;
        padding: 10px 14px;
        gap: 8px;
      }

      .hdr-center {
        order: -1;
        width: 100%;
      }

      .brand-title {
        font-size: 16px;
      }

      .security {
        display: none;
      }

      .main-wrap {
        padding: 10px 10px 8px;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar-left, .toolbar-right {
        justify-content: center;
      }

      .btn {
        width: 100%;
      }

      .ftr {
        flex-direction: column;
        gap: 4px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spin"></div>
    데이터 로딩 중...
  </div>

  <header class="hdr">
    <div class="hdr-left">
      <div class="brand-badge">LAM</div>
    </div>

    <div class="hdr-center">
      <div class="brand-title">Market <span>Information</span> Slide</div>
    </div>

    <div class="hdr-right">
      <div class="sel-wrap">
        <select id="dateSelect" onchange="onDateChange(this.value)">
          <option value="">날짜 선택</option>
        </select>
      </div>

      <div class="sel-wrap">
        <select id="labelSelect" onchange="selectLabel(this.value)">
          <option value="">분류 선택</option>
        </select>
      </div>

      <div class="security">보안 · 복제배포 금지</div>
    </div>
  </header>

  <div class="main-wrap">
    <div class="viewer-frame">
      <iframe id="pdfViewer" class="pdf-viewer"></iframe>

      <div class="empty-state" id="emptyState">
        <div class="big">📄</div>
        <div class="msg">날짜와 분류를 선택하면 PDF가 표시됩니다</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <a id="openBtn" class="btn disabled" href="#" target="_blank" rel="noopener noreferrer">새 창에서 열기</a>
        <a id="downloadBtn" class="btn disabled" href="#" target="_blank" rel="noopener noreferrer">PDF 열기</a>
      </div>

      <div class="toolbar-right">
        <div class="file-name" id="fileName">선택된 파일 없음</div>
        <div class="source">Source: PDF Archive</div>
      </div>
    </div>
  </div>

  <footer class="ftr">
    <div class="ftr-left">Created by JS Kim of LAM (첨단구매1팀)</div>
    <div class="ftr-right">© 2026 Lotte Chemical Advanced Materials</div>
  </footer>

  <script>
    let listData = {};
    let curDate = '';
    let curLabel = '';
    let curPdf = '';

    async function init() {
      try {
        const res = await fetch('pdfs/list.json?t=' + Date.now());
        if (!res.ok) throw new Error('pdfs/list.json 로드 실패');
        listData = await res.json();

        buildDateSelect();

        const dates = Object.keys(listData);
        if (dates.length > 0) {
          const latestDate = dates[dates.length - 1];
          document.getElementById('dateSelect').value = latestDate;
          onDateChange(latestDate);
        } else {
          showEmpty('등록된 PDF가 없습니다');
        }
      } catch (e) {
        console.error(e);
        showEmpty('pdfs/list.json을 찾을 수 없습니다');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function buildDateSelect() {
      const sel = document.getElementById('dateSelect');
      sel.innerHTML = '<option value="">날짜 선택</option>';

      const dates = Object.keys(listData).slice().reverse();
      dates.forEach(d => {
        const o = document.createElement('option');
        o.value = d;
        o.textContent = formatDate(d);
        sel.appendChild(o);
      });
    }

    function onDateChange(date) {
      if (!date || !listData[date]) {
        resetViewer('해당 날짜 데이터가 없습니다');
        return;
      }

      curDate = date;
      const labels = Object.keys(listData[date]);
      buildLabelSelect(labels);

      if (labels.length > 0) {
        document.getElementById('labelSelect').value = labels[0];
        selectLabel(labels[0]);
      } else {
        resetViewer('해당 날짜에 등록된 PDF가 없습니다');
      }
    }

    function buildLabelSelect(labels) {
      const sel = document.getElementById('labelSelect');
      sel.innerHTML = '<option value="">분류 선택</option>';

      labels.forEach(label => {
        const o = document.createElement('option');
        o.value = label;
        o.textContent = label;
        sel.appendChild(o);
      });
    }

    function selectLabel(label) {
      if (!label || !curDate || !listData[curDate]) {
        resetViewer('PDF를 선택할 수 없습니다');
        return;
      }

      curLabel = label;
      const fileName = listData[curDate][label];

      if (!fileName) {
        resetViewer('선택한 분류의 PDF가 없습니다');
        return;
      }

      curPdf = `pdfs/${fileName}`;
      renderPdf(curPdf, fileName);
    }

    function renderPdf(pdfPath, fileName) {
      const viewer = document.getElementById('pdfViewer');
      const empty = document.getElementById('emptyState');
      const openBtn = document.getElementById('openBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const fileNameBox = document.getElementById('fileName');

      viewer.src = pdfPath + '#view=FitH';
      viewer.style.display = 'block';
      empty.style.display = 'none';

      openBtn.href = pdfPath;
      downloadBtn.href = pdfPath;
      openBtn.classList.remove('disabled');
      downloadBtn.classList.remove('disabled');

      fileNameBox.textContent = fileName;
    }

    function resetViewer(message = '선택된 파일 없음') {
      curPdf = '';

      const viewer = document.getElementById('pdfViewer');
      const empty = document.getElementById('emptyState');
      const msg = empty.querySelector('.msg');
      const openBtn = document.getElementById('openBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const fileNameBox = document.getElementById('fileName');

      viewer.removeAttribute('src');
      viewer.style.display = 'none';

      msg.textContent = message;
      empty.style.display = 'flex';

      openBtn.href = '#';
      downloadBtn.href = '#';
      openBtn.classList.add('disabled');
      downloadBtn.classList.add('disabled');

      fileNameBox.textContent = '선택된 파일 없음';
    }

    function showEmpty(message) {
      const viewer = document.getElementById('pdfViewer');
      const empty = document.getElementById('emptyState');
      viewer.style.display = 'none';
      empty.style.display = 'flex';
      empty.querySelector('.msg').textContent = message;
      document.getElementById('fileName').textContent = '선택된 파일 없음';
    }

    function formatDate(d) {
      return d.length === 6
        ? `20${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4,6)}`
        : d;
    }

    init();
  </script>
</body>
</html>
